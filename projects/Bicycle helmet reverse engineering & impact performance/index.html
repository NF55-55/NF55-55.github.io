<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Case Study & Presentation</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .nav-back {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 1.5rem;
      font-weight: bold;
    }
    .header {
      margin-bottom: 2rem;
    }
    .header h1 {
      margin-bottom: 0.5rem;
    }
    .header p {
      color: var(--text-muted);
      line-height: 1.6;
    }
    .pdf-container {
      width: 100%;
      height: 600px;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid #334155;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .actions {
      display: flex;
      gap: 1rem;
    }
    .btn {
      background: var(--accent);
      color: #0f172a;
      text-decoration: none;
      padding: 0.75rem 1.25rem;
      border-radius: 4px;
      font-weight: bold;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Back to gallery link -->
    <a href="../../index.html" class="nav-back">← Back to All Projects</a>

    <!-- Project Title & Overview -->
    <div class="header">
      <h1>Bicycle helmet reverse engineering & impact performance analysis</h1>
      <p>
        <strong>Tools:</strong> RealityScan (mobile), Rhino 8, Abaqus (FEA pre-processor), OpenRadioss (FE explicit solver), ParaView, cloud computing (Oracle Cloud Infrastructure)<br>
      </p>
    </div>

    <!-- Embedded PDF Viewer -->
    <div class="pdf-container">
      <iframe src="slides.pdf" type="application/pdf">
        <p>Your browser does not support embedded PDFs. 
           <a href="slides.pdf">Click here to download the PDF instead.</a>
        </p>
      </iframe>
    </div>

    <!-- Direct Download Button -->
    <div class="actions">
      <a href="slides.pdf" download class="btn">Download Presentation (PDF)</a>
    </div>
  </div>

</body>
</html>
