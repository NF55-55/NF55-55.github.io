<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Case Study & Presentation</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .nav-back {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 1.5rem;
      font-weight: bold;
    }
    .header {
      margin-bottom: 2rem;
    }
    .header h1 {
      margin-bottom: 0.5rem;
    }
    .header p {
      color: var(--text-muted);
      line-height: 1.6;
    }
    .pdf-container {
      width: 100%;
      height: 600px;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid #334155;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .media-container {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid #334155;
      padding: 1.5rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    .media-container h3 {
      margin-top: 0;
      text-align: left;
      font-size: 1.2rem;
      color: var(--text);
    }
    .media-container img {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin-top: 0.5rem;
      display: block;
    }
    
    .btn {
      background: var(--accent);
      color: #0f172a;
      text-decoration: none;
      padding: 0.75rem 1.25rem;
      border-radius: 4px;
      font-weight: bold;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Back to gallery link -->
    <a href="../../index.html" class="nav-back">← Back to All Projects</a>

    <!-- Project Title & Overview -->
    <div class="header">
      <h1>CFD analysis of a MRL tidal turbine</h1>
      <p>
        <strong>Tools:</strong> OpenFOAM (CFD FVM-based solver), ParaView, Python and MATLAB for post-processing, cloud computing (Google Cloud)<br>
      </p>
    </div>

    <!-- Embedded PDF Viewer -->
    <div class="pdf-container">
      <iframe src="ProjectReport.pdf" type="application/pdf">
        <p>Your browser does not support embedded PDFs. 
           <a href="ProjectReport.pdf">Click here to download the PDF instead.</a>
        </p>
      </iframe>
    </div>

    <div class="media-container">
      <h3>Turbulent kinetic energy field (40 rpm - zoomed close to the tidal turbine)</h3>
      <img src="animation.gif" alt="Project Simulation GIF Animation">
    </div>

</body>
</html>
